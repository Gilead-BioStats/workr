name: Deploy to GitHub Pages

on:
  push:
    branches: ['ss-*']
  schedule:
    - cron: '30 2 * * *'   # nightly at 2:30 AM UTC
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Glob pattern for snapshot branches (e.g. ss-*, release-*)'
        required: false
        default: 'ss-*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/data

          PATTERN="${{ inputs.branch_pattern || 'ss-*' }}"
          echo "Branch pattern: $PATTERN"

          # Discover branches matching the pattern
          MATCHED=$(git branch -r --list "origin/$PATTERN" | sed 's|origin/||' | tr -d ' ' || true)
          ALL=$(echo "$MATCHED" | tr ' ' '\n' | sort -u | grep -v '^$')

          FOUND_BRANCHES=()
          for BRANCH in $ALL; do
            if ! git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
              echo "⏭ $BRANCH (not found)"
              continue
            fi

            echo "── $BRANCH ──"
            DEST="docs/data/$BRANCH"
            mkdir -p "$DEST"

            # Check if workflows/ directory exists on this branch
            HAS_WORKFLOWS=$(git ls-tree "origin/$BRANCH" --name-only -d | grep -x 'workflows' || true)
            if [ -n "$HAS_WORKFLOWS" ]; then
              git archive "origin/$BRANCH" -- workflows/ | tar -x -C "$DEST"
              find "$DEST/workflows" -name '*.yaml' -type f \
                | sed "s|$DEST/||" | sort \
                | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" \
                > "$DEST/_index.json"
              COUNT=$(python3 -c "import json; print(len(json.load(open('$DEST/_index.json'))))")
              echo "  workflows: $COUNT yaml files"
            else
              echo "  workflows: none"
              echo '[]' > "$DEST/_index.json"
            fi

            # Copy manifest.csv if it exists
            if git cat-file -e "origin/$BRANCH:manifest.csv" 2>/dev/null; then
              git show "origin/$BRANCH:manifest.csv" > "$DEST/manifest.csv"
              # Write snapshot date (last commit date of manifest.csv on this branch)
              git log -1 --format="%ci" "origin/$BRANCH" -- manifest.csv | cut -d' ' -f1 > "$DEST/_snapshot_date.txt"
              echo "  manifest.csv: yes (snapshot: $(cat "$DEST/_snapshot_date.txt"))"
            else
              echo "  manifest.csv: no"
            fi

            FOUND_BRANCHES+=("$BRANCH")
          done

          # Write branches.json
          python3 -c "import json,sys; print(json.dumps(sys.argv[1:]))" "${FOUND_BRANCHES[@]}" > docs/data/branches.json
          echo "branches.json: $(cat docs/data/branches.json)"

      - name: Build Vite app
        run: |
          cd site
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
