name: Deploy Workflow Explorer

on:
  push:
    branches: ['ss-*']
  schedule:
    - cron: '30 2 * * *'   # nightly at 2:30 AM UTC
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Glob pattern for snapshot branches (e.g. ss-*, release-*)'
        required: false
        default: 'ss-*'
      deploy_path:
        description: 'Subfolder on gh-pages to deploy into (e.g. explorer, library)'
        required: false
        default: 'explorer'

permissions:
  contents: write

concurrency:
  group: deploy-explorer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/data

          PATTERN="${{ inputs.branch_pattern || 'ss-*' }}"
          echo "Branch pattern: $PATTERN"

          MATCHED=$(git branch -r --list "origin/$PATTERN" | sed 's|origin/||' | tr -d ' ' || true)
          ALL=$(echo "$MATCHED" | tr ' ' '\n' | sort -u | grep -v '^$')

          FOUND_BRANCHES=()
          for BRANCH in $ALL; do
            if ! git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
              echo "⏭ $BRANCH (not found)"
              continue
            fi

            echo "── $BRANCH ──"
            DEST="docs/data/$BRANCH"
            mkdir -p "$DEST"

            HAS_WORKFLOWS=$(git ls-tree "origin/$BRANCH" --name-only -d | grep -x 'workflows' || true)
            if [ -n "$HAS_WORKFLOWS" ]; then
              git archive "origin/$BRANCH" -- workflows/ | tar -x -C "$DEST"
              find "$DEST/workflows" -name '*.yaml' -type f \
                | sed "s|$DEST/||" | sort \
                | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" \
                > "$DEST/_index.json"
              COUNT=$(python3 -c "import json; print(len(json.load(open('$DEST/_index.json'))))")
              echo "  workflows: $COUNT yaml files"
            else
              echo "  workflows: none"
              echo '[]' > "$DEST/_index.json"
            fi

            if git cat-file -e "origin/$BRANCH:manifest.csv" 2>/dev/null; then
              git show "origin/$BRANCH:manifest.csv" > "$DEST/manifest.csv"
              git log -1 --format="%ci" "origin/$BRANCH" -- manifest.csv | cut -d' ' -f1 > "$DEST/_snapshot_date.txt"
              echo "  manifest.csv: yes (snapshot: $(cat "$DEST/_snapshot_date.txt"))"
            else
              echo "  manifest.csv: no"
            fi

            FOUND_BRANCHES+=("$BRANCH")
          done

          python3 -c "import json,sys; print(json.dumps(sys.argv[1:]))" "${FOUND_BRANCHES[@]}" > docs/data/branches.json
          echo "branches.json: $(cat docs/data/branches.json)"

      - name: Build Vite app
        run: |
          cd site
          npm ci
          npm run build

      - name: Deploy to gh-pages subfolder
        run: |
          DEPLOY_PATH="${{ inputs.deploy_path || 'explorer' }}"
          echo "Deploying to gh-pages/$DEPLOY_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save built site
          cp -r docs /tmp/explorer-build

          # Checkout or create gh-pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# GitHub Pages" > README.md
            git add README.md
            git commit -m "init gh-pages"
          fi

          # Replace only the deploy subfolder, leave everything else intact
          rm -rf "$DEPLOY_PATH"
          cp -r /tmp/explorer-build "$DEPLOY_PATH"

          git add "$DEPLOY_PATH/"
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: update workflow explorer $(date +%Y-%m-%d)"
            git push origin gh-pages
          fi
