# gsm.utils GHA version: 0.2.0
# Generated by: https://github.com/Gilead-BioStats/gsm.utils
# Description: Deploy pkgdown site with examples

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

name: pkgdown-examples

jobs:
  pkgdown-examples:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set Development Mode Env Var
        if: github.ref_name != 'main'
        run: |
          echo "Ref is '${{ github.ref_name }}', setting PKGDOWN_DEV_MODE=devel"
          echo "PKGDOWN_DEV_MODE=devel" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::rmarkdown, local::., Gilead-BioStats/gsm.utils
          needs: website

      - name: Render examples
        shell: Rscript {0}
        run: |
          gsm.utils::render_examples()

      - name: Generate examples menu
        shell: Rscript {0}
        run: |
          gsm.utils::add_pkgdown_examples(pkgdown_yml = "_pkgdown.yml")

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: |
          quarto render slides/index.qmd

      - name: Copy slides to pkgdown site
        run: |
          mkdir -p pkgdown/assets/slides
          cp -r slides/_site/* pkgdown/assets/slides

      - name: Build workflow explorer
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build explorer data and app
        run: |
          set -euo pipefail
          git fetch --all
          mkdir -p explorer-build/data

          PATTERN="ss-*"
          MATCHED=$(git branch -r --list "origin/$PATTERN" | sed 's|origin/||' | tr -d ' ' || true)
          ALL=$(echo "$MATCHED" | tr ' ' '\n' | sort -u | grep -v '^$')

          FOUND_BRANCHES=()
          for BRANCH in $ALL; do
            if ! git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
              continue
            fi
            echo "── $BRANCH ──"
            DEST="explorer-build/data/$BRANCH"
            mkdir -p "$DEST"

            HAS_WORKFLOWS=$(git ls-tree "origin/$BRANCH" --name-only -d | grep -x 'workflows' || true)
            if [ -n "$HAS_WORKFLOWS" ]; then
              git archive "origin/$BRANCH" -- workflows/ | tar -x -C "$DEST"
              find "$DEST/workflows" -name '*.yaml' -type f \
                | sed "s|$DEST/||" | sort \
                | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" \
                > "$DEST/_index.json"
            else
              echo '[]' > "$DEST/_index.json"
            fi

            if git cat-file -e "origin/$BRANCH:manifest.csv" 2>/dev/null; then
              git show "origin/$BRANCH:manifest.csv" > "$DEST/manifest.csv"
              git log -1 --format="%ci" "origin/$BRANCH" -- manifest.csv | cut -d' ' -f1 > "$DEST/_snapshot_date.txt"
            fi
            FOUND_BRANCHES+=("$BRANCH")
          done

          python3 -c "import json,sys; print(json.dumps(sys.argv[1:]))" "${FOUND_BRANCHES[@]}" > explorer-build/data/branches.json

          cd site
          npm ci
          npm run build
          cd ..

          # docs/ has the built single-file index.html — merge with data
          cp docs/index.html explorer-build/

      - name: Copy explorer to pkgdown site
        run: |
          mkdir -p pkgdown/assets/explorer
          cp -r explorer-build/* pkgdown/assets/explorer
          
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}



      - name: Deploy PR preview 🧪
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # Don't clean the whole branch, just the target folder
          clean: false
          branch: gh-pages
          folder: docs
          # Deploy to a subdirectory named after the PR number
          target-folder: pr/${{ github.event.number }}

      - name: PR site URL 🌐
        if: github.event_name == 'pull_request'
        run: |
          echo "🌐 URL: https://gilead-biostats.github.io/${{ github.event.repository.name }}/pr/${{ github.event.number }}/dev"

      - name: Comment with PR site URL 🌐
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const prSiteURL = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr/${context.issue.number}/dev`
            const timestamp = new Date().toISOString();
            const commentBody = `🌐 PR pkgdown deployed: [${prSiteURL}](${prSiteURL})\n\n_Last updated: ${timestamp}_`;
            const commentMarker = '🌐 PR pkgdown deployed:';

            // Get all comments on the PR
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Find existing comment from this bot
            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(commentMarker)
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            }
      - name: Deploy pkgdown 📃
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
