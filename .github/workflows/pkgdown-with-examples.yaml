# gsm.utils GHA version: 0.2.0
# Generated by: https://github.com/Gilead-BioStats/gsm.utils
# Description: Deploy pkgdown site with examples

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

name: pkgdown-examples

jobs:
  pkgdown-examples:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set Development Mode Env Var
        if: github.ref_name != 'main'
        run: |
          echo "Ref is '${{ github.ref_name }}', setting PKGDOWN_DEV_MODE=devel"
          echo "PKGDOWN_DEV_MODE=devel" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::rmarkdown, local::., Gilead-BioStats/gsm.utils
          needs: website

      - name: Render examples
        shell: Rscript {0}
        run: |
          gsm.utils::render_examples()

      - name: Generate examples menu
        shell: Rscript {0}
        run: |
          gsm.utils::add_pkgdown_examples(pkgdown_yml = "_pkgdown.yml")

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: |
          quarto render slides/index.qmd

      - name: Copy slides to pkgdown site
        run: |
          mkdir -p pkgdown/assets/slides
          cp -r slides/_site/* pkgdown/assets/slides
          
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}



      - name: Deploy PR preview 🧪
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # Don't clean the whole branch, just the target folder
          clean: false
          branch: gh-pages
          folder: docs
          # Deploy to a subdirectory named after the PR number
          target-folder: pr/${{ github.event.number }}

      - name: PR site URL 🌐
        if: github.event_name == 'pull_request'
        run: |
          echo "🌐 URL: https://gilead-biostats.github.io/${{ github.event.repository.name }}/pr/${{ github.event.number }}/dev"

      - name: Comment with PR site URL 🌐
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const prSiteURL = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr/${context.issue.number}/dev`
            const timestamp = new Date().toISOString();
            const commentBody = `🌐 PR pkgdown deployed: [${prSiteURL}](${prSiteURL})\n\n_Last updated: ${timestamp}_`;
            const commentMarker = '🌐 PR pkgdown deployed:';

            // Get all comments on the PR
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Find existing comment from this bot
            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(commentMarker)
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            }
      - name: Deploy pkgdown 📃
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'

      - name: Restore explorer subfolder
        if: github.event_name != 'pull_request'
        run: |
          # pkgdown::deploy_to_branch force-pushes gh-pages, which may wipe
          # the explorer/ subfolder. Restore it from the previous gh-pages commit.
          git fetch origin gh-pages
          git checkout gh-pages

          # Check if explorer/ existed in the parent commit
          PARENT=$(git log --skip=1 -1 --format="%H" 2>/dev/null || true)
          if [ -n "$PARENT" ] && git ls-tree "$PARENT" --name-only -d | grep -qx 'explorer'; then
            echo "Restoring explorer/ from $PARENT"
            git checkout "$PARENT" -- explorer/
            git add explorer/
            if ! git diff --cached --quiet; then
              git commit -m "restore: explorer/ after pkgdown deploy"
              git push origin gh-pages
            else
              echo "explorer/ already present"
            fi
          else
            echo "No explorer/ to restore"
          fi
