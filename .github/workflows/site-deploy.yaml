name: Deploy Workflow Explorer (Standalone)

# Standalone deploy — uses GitHub Pages artifact API to deploy the explorer
# as the entire site. For use in repos without pkgdown (e.g. gsm.library).

on:
  push:
    branches: ['ss-*']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Glob pattern for snapshot branches'
        required: false
        default: 'ss-*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/site-build.yaml
    with:
      branch_pattern: ${{ inputs.branch_pattern || 'ss-*' }}
      output_path: explorer-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: explorer-build
          path: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
