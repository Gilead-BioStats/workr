name: Snapshot Packages

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to commit snapshot output to'
        required: true
        type: string
      target:
        description: 'Target branch for PR (leave empty to skip PR creation)'
        required: false
        type: string
        default: ''
      pkglist:
        description: 'Comma-separated GitHub refs. Leave empty to use manifest.csv.'
        required: false
        type: string
        default: ''
      pkg_branch:
        description: 'Branch to resolve untagged packages from'
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit snapshot output to'
        required: true
        default: 'snapshot/dev'
      target:
        description: 'Target branch for PR (leave empty to skip PR creation)'
        required: false
        default: ''
      pkglist:
        description: 'Comma-separated GitHub refs. Leave empty to use manifest.csv.'
        required: false
        default: ''
      pkg_branch:
        description: 'Branch to resolve untagged packages from'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R dependencies
        run: |
          install.packages("base64enc")
        shell: Rscript {0}

      - name: Set inputs
        id: inputs
        run: |
          echo "branch=${{ inputs.branch }}" >> $GITHUB_OUTPUT
          echo "target=${{ inputs.target }}" >> $GITHUB_OUTPUT
          echo "pkglist=${{ inputs.pkglist }}" >> $GITHUB_OUTPUT
          echo "pkg_branch=${{ inputs.pkg_branch }}" >> $GITHUB_OUTPUT

      - name: Run snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Source all R files
          r_files <- list.files("R", pattern = "\\.R$", full.names = TRUE)
          for (f in r_files) source(f)

          # Use provided pkglist or fall back to manifest.csv
          pkglist_input <- "${{ steps.inputs.outputs.pkglist }}"
          if (nchar(trimws(pkglist_input)) > 0) {
            pkglist <- trimws(strsplit(pkglist_input, ",")[[1]])
          } else {
            pkglist <- pkgListFromManifest("manifest.csv")
          }

          # Run snapshot
          pkg_branch_input <- "${{ steps.inputs.outputs.pkg_branch }}"
          pkg_branch <- if (nchar(trimws(pkg_branch_input)) > 0) trimws(pkg_branch_input) else NULL

          pkgSnapshot(
            path = "snapshot_output",
            packageList = pkglist,
            branch = pkg_branch
          )
        shell: Rscript {0}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push to branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.inputs.outputs.branch }}"

          # Create or checkout the target branch
          git fetch origin "$BRANCH" 2>/dev/null || true
          git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH"

          # Copy snapshot output to repo root
          cp -f snapshot_output/manifest.csv . 2>/dev/null || true
          cp -f snapshot_output/rproject.toml . 2>/dev/null || true
          if [ -d snapshot_output/workflows ]; then
            rm -rf workflows
            cp -r snapshot_output/workflows .
          fi
          rm -rf snapshot_output

          # Stage and commit
          git add manifest.csv rproject.toml workflows/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "chore: update package snapshot $(date +%Y-%m-%d)"
            git push origin "$BRANCH"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Create PR if target specified
        if: env.HAS_CHANGES == 'true' && steps.inputs.outputs.target != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.inputs.outputs.branch }}"
          TARGET="${{ steps.inputs.outputs.target }}"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base "$TARGET" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --head "$BRANCH" \
              --base "$TARGET" \
              --title "chore: package snapshot update $(date +%Y-%m-%d)" \
              --body "Automated package snapshot update.

          Generated from: \`${{ steps.inputs.outputs.pkglist }}\`"
          else
            echo "PR #$EXISTING_PR already exists for $BRANCH -> $TARGET"
          fi
