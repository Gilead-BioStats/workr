meta:
  Type: Analysis
  ID: kri0001
  GroupLevel: Site
  Abbreviation: AE
  Metric: Adverse Event Rate
  Numerator: Adverse Events
  Denominator: Days on Study
  Model: Normal Approximation
  Score: Adjusted Z-Score
  AnalysisType: rate
  Threshold: -2,-1,2,3
  Priority: 2
spec:
  Mapped_AE: kri0001_Mapped_AE_spec.yaml
  Mapped_SUBJ: kri0001_Mapped_SUBJ_spec.yaml
steps:
  - output: vThreshold
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Threshold
  #- output: Temp_SAE
  #  name: RunQuery
  #  params:
  #    df: Mapped_AE
  #    strQuery: "SELECT * FROM df WHERE aeser = 'Y'"
  - output: Analysis_Input
    name: gsm.core::Input_Rate
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Mapped_AE
      dfDenominator: Mapped_SUBJ
      strSubjectCol: subjid
      strGroupCol: invid
      strGroupLevel: GroupLevel
      strNumeratorMethod: Count
      strDenominatorMethod: Sum
      strDenominatorCol: timeonstudy
  - output: Analysis_Transformed
    name: gsm.core::Transform_Rate
    params:
      dfInput: Analysis_Input
  - output: Analysis_Analyzed
    name: gsm.core::Analyze_NormalApprox
    params:
      dfTransformed: Analysis_Transformed
      strType: AnalysisType
  - output: Analysis_Flagged
    name: gsm.core::Flag
    params:
      dfAnalyzed: Analysis_Analyzed
      vThreshold: vThreshold
  - output: Analysis_Summary
    name: gsm.core::Summarize
    params:
      dfFlagged: Analysis_Flagged
  - output: Flag_Distribution
    name: workr::RunQuery
    params:
      df: Analysis_Summary
      strQuery: >
        SELECT
          Flag,
          COUNT(*) AS Count,
          ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS Pct
        FROM df
        GROUP BY Flag
        ORDER BY Flag DESC
