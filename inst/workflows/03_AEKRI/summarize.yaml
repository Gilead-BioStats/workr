meta:
  Type: Report
  ID: summarize
  Description: Flag distribution and flagged site listing
  Priority: 3
spec:
  Analysis_kri0001:
    GroupID:
      type: character
    Flag:
      type: integer
steps:
  - output: Flag_Distribution
    name: gsm.core::RunQuery
    params:
      df: Analysis_kri0001
      strQuery: >
        SELECT
          Flag,
          COUNT(*) AS Count,
          ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS Pct
        FROM df
        GROUP BY Flag
        ORDER BY Flag DESC
  - output: Flagged_Sites
    name: gsm.core::RunQuery
    params:
      df: Analysis_kri0001
      strQuery: >
        SELECT
          GroupID AS Site,
          Numerator,
          Denominator,
          ROUND(Metric, 4) AS Metric,
          ROUND(Score, 2) AS Score,
          Flag
        FROM df
        WHERE Flag != 0
        ORDER BY ABS(Flag) DESC, ABS(Score) DESC
