meta:
  ID: VS
  Type: SDTM
  Description: Transform Raw VS to a minimal SDTM VS example
  Priority: 1
spec:
  vs_raw:
    _all:
      required: true
steps:
  - output: vs
    name: workr::RunQuery
    params:
      df: vs_raw
      strQuery: "SELECT 'test_study' AS STUDYID, 'test_study-' || PATNUM AS USUBJID, 'SYSBP' AS VSTESTCD, CAST(SYS_BP AS DOUBLE) AS VSORRES, 'mmHg' AS VSORRESU, VTLD || 'T' || VTLTM AS VSDTC, 'VISIT1' AS VISIT, 1 AS VISITNUM, 'PREDOSE' AS VSTPT, 0 AS VSTPTNUM FROM df"
