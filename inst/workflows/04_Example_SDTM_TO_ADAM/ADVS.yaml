meta:
  ID: ADVS
  Type: ADAM
  Description: Create Basic ADVS
  Priority: 1
spec:
  SDTM_DM:
    _all:
      required: true
  SDTM_VS:
    _all:
      required: true
steps:
  - output: initial_advs
    name: base::merge
    params:
      x: SDTM_VS
      "y": SDTM_DM
      by:
        - STUDYID
        - USUBJID
  - output: advs
    name: workr::RunQuery
    params:
      df: initial_advs
      strQuery: "SELECT *, VSTESTCD AS PARAMCD, CAST(VSORRES AS DOUBLE) AS AVAL FROM df"
